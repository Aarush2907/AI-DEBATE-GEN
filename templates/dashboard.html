<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Socrates AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    .greeting {
      font-size: 3rem;
      font-weight: 600;
      background: linear-gradient(to right, #78B9B5, #0F828C);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border-right: 4px solid #78B9B5;
      display: inline-block;
      padding-right: 5px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="greeting" id="greeting"></div>
  </div>

  <script>
    const text = "Hello, {{ first_name }} {{ last_name }}";
    const greetingElement = document.getElementById('greeting');

    let i = 0;
    const speed = 100; // ms per char

    function typeWriter() {
      if (i < text.length) {
        greetingElement.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      } else {
        // Stop blinking cursor after a while
        setTimeout(() => {
          greetingElement.style.borderRight = 'none';
        }, 1000);
      }
    }

    // Start typing
    typeWriter();
  </script>
</body>

</html>
