<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Socrates AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>
  <!-- Greeting Animation Container -->
  <div class="greeting-container" id="greetingContainer">
    <h1 class="greeting-text" id="greetingText"></h1>
  </div>

  <!-- Header -->
  <header class="dashboard-header" id="dashboardHeader">
    <h1 class="header-title">Socrates AI</h1>
    <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
  </header>

  <!-- Main Dashboard Container (hidden initially) -->
  <div class="dashboard-container" id="dashboardContainer">
    <div class="debate-input-section">
      <div class="input-wrapper">
        <input type="text" id="debateTopic" class="debate-input" placeholder="Enter your debate topic..."
          autocomplete="off" />
        <button class="start-debate-btn" id="startDebateBtn">
          Start Debate
        </button>
      </div>
    </div>
  </div>

  <script>
    const firstName = "{{ first_name }}";
    const lastName = "{{ last_name }}";
    const greetingText = document.getElementById('greetingText');
    const greetingContainer = document.getElementById('greetingContainer');
    const dashboardContainer = document.getElementById('dashboardContainer');
    const dashboardHeader = document.getElementById('dashboardHeader');

    // Typewriter effect function
    function typeWriter(text, element, speed = 100) {
      return new Promise((resolve) => {
        let i = 0;
        element.textContent = '';

        function type() {
          if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
            setTimeout(type, speed);
          } else {
            resolve();
          }
        }

        type();
      });
    }

    // Delete text effect
    function deleteText(element, speed = 50) {
      return new Promise((resolve) => {
        const text = element.textContent;
        let i = text.length;

        function deleteChar() {
          if (i > 0) {
            element.textContent = text.substring(0, i - 1);
            i--;
            setTimeout(deleteChar, speed);
          } else {
            resolve();
          }
        }

        deleteChar();
      });
    }

    // Main animation sequence
    async function startAnimation() {
      // Type "Hello [Name]"
      await typeWriter(`Hello ${firstName}`, greetingText, 80);

      // Pause
      await new Promise(resolve => setTimeout(resolve, 1500));

      // Delete text
      await deleteText(greetingText, 40);

      // Pause
      await new Promise(resolve => setTimeout(resolve, 300));

      // Type "Socrates AI"
      await typeWriter('Socrates AI', greetingText, 80);

      // Pause
      await new Promise(resolve => setTimeout(resolve, 1000));

      // Fade out greeting and fade in dashboard
      greetingContainer.classList.add('fade-out');

      setTimeout(() => {
        greetingContainer.style.display = 'none';
        dashboardContainer.classList.add('fade-in');
        dashboardHeader.classList.add('fade-in'); // Also fade in the header
      }, 500);
    }

    // Start animation when page loads
    window.addEventListener('load', startAnimation);

    // Start Debate button functionality
    document.getElementById('startDebateBtn').addEventListener('click', function () {
      const topic = document.getElementById('debateTopic').value.trim();

      if (topic === '') {
        // Add shake animation to input if empty
        const input = document.getElementById('debateTopic');
        input.classList.add('shake');
        setTimeout(() => input.classList.remove('shake'), 500);
        return;
      }

      // TODO: Handle debate start logic
      console.log('Starting debate on topic:', topic);
      alert('Debate functionality coming soon! Topic: ' + topic);
    });

    // Allow Enter key to start debate
    document.getElementById('debateTopic').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        document.getElementById('startDebateBtn').click();
      }
    });
  </script>
</body>

</html>
